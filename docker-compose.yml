---
services:
  flaresolverr:
    # GitHub Container Registry ghcr.io/smeinecke/flaresolverr:latest
    image: ghcr.io/smeinecke/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FILE=${LOG_FILE:-none}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - SESSION_MAX_RUNTIME=${SESSION_MAX_RUNTIME:-}
      - SESSION_IDLE_TIMEOUT=${SESSION_IDLE_TIMEOUT:-900}
      - SESSION_MAX_COUNT=${SESSION_MAX_COUNT:-}
      - MAX_PARALLEL_REQUESTS=${MAX_PARALLEL_REQUESTS:-}
      - AGENT_CHECK_PORT=${AGENT_CHECK_PORT:-}
      - AGENT_CHECK_HOST=${AGENT_CHECK_HOST:-127.0.0.1}
      - TZ=Europe/London
    ports:
      - "${PORT_BIND:-127.0.0.1}:${PORT:-8191}:8191"
    volumes:
      - /var/lib/flaresolver:/config
    restart: unless-stopped
