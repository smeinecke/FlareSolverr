name: Python Code Checks

permissions:
  contents: read
  checks: write

on:
  pull_request:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build FlareSolverr Docker image
        run: |
          docker build -t flaresolverr-ci:${{ github.sha }} .

  test:
    name: Validate Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache uv
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pip
          key: uv-cache-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            uv-cache-

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --group dev --extra test

      - name: Run Ruff (Formatting Check)
        run: |
          uv run make format

      - name: Run Ruff (Linting)
        run: |
          uv run make check || true  # Allow some linting errors for now

      - name: Run vulture (Dead Code)
        run: |
          uv run make vulture || true  # Allow failures for third-party code

      - name: Run xenon (Complexity)
        run: |
          uv run make xenon

      - name: Run bandit (Security)
        run: |
          uv run make bandit

      - name: Run pyright (Type Checking)
        run: |
          uv run make pyright || true  # Type checking may have issues

      - name: Run pytest (Unit Tests)
        run: |
          uv run make test

  integration:
    name: Integration Tests (Docker + Proxies)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache uv
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pip
          key: uv-cache-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            uv-cache-

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --group dev --extra test

      - name: Create test compose file
        run: |
          cat > docker-compose.test.yml << 'EOF'
          services:
            flaresolverr:
              build: .
              ports:
                - "127.0.0.1:8191:8191"
              networks:
                - test-network
            proxy-http:
              build:
                context: .github/docker/tinyproxy
                dockerfile: Dockerfile
              ports:
                - "127.0.0.1:8888:8888"
              networks:
                - test-network
            proxy-socks:
              image: serjs/go-socks5-proxy:latest
              environment:
                - REQUIRE_AUTH=false
              ports:
                - "127.0.0.1:1080:1080"
              networks:
                - test-network
          networks:
            test-network:
              driver: bridge
          EOF

      - name: Start all services
        run: |
          docker compose -f docker-compose.test.yml up -d --build

      - name: Wait for FlareSolverr to be ready
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8191/ >/dev/null 2>&1; then
              echo "FlareSolverr is ready"
              exit 0
            fi
            sleep 2
          done
          echo "FlareSolverr failed to start"
          docker compose -f docker-compose.test.yml logs flaresolverr
          exit 1

      - name: Wait for proxies to be ready
        run: |
          for i in {1..30}; do
            if curl -fsS --proxy http://127.0.0.1:8888 https://example.com >/dev/null && \
               curl -fsS --socks5-hostname 127.0.0.1:1080 https://example.com >/dev/null; then
              echo "Proxies are ready"
              exit 0
            fi
            sleep 2
          done
          echo "Proxy readiness check failed"
          docker compose -f docker-compose.test.yml logs
          exit 1

      - name: Run integration tests (proxy scenarios)
        env:
          FLARESOLVERR_URL: http://127.0.0.1:8191
          PROXY_HTTP_URL: http://proxy-http:8888
          PROXY_SOCKS_URL: socks5://proxy-socks:1080
        run: |
          uv run pytest -m integration tests/integration/test_api.py -k "proxy_http_param or proxy_http_param_with_credentials or proxy_socks_param" -vv

      - name: Dump FlareSolverr logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.test.yml logs flaresolverr

      - name: Dump proxy logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.test.yml logs

      - name: Tear down services
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v --remove-orphans
          rm -f docker-compose.test.yml

  backend-matrix:
    name: Backend Matrix Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [undetected_chromedriver, custom_chromium, playwright, camoufox, seleniumbase]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache uv
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pip
          key: uv-cache-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            uv-cache-

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install base dependencies
        run: |
          uv sync --group dev --extra test

      - name: Install Playwright dependencies
        if: matrix.backend == 'playwright'
        run: |
          uv pip install --no-cache-dir 'playwright>=1.50'
          uv run playwright install chromium

      - name: Install Camoufox dependencies
        if: matrix.backend == 'camoufox'
        run: |
          uv pip install --no-cache-dir 'camoufox[geoip]>=0.3'
          uv run python -m camoufox fetch

      - name: Install SeleniumBase dependencies
        if: matrix.backend == 'seleniumbase'
        run: |
          uv pip install --no-cache-dir 'seleniumbase>=4.30'

      - name: Run backend tests
        env:
          DRIVER_BACKEND: ${{ matrix.backend }}
          HEADLESS: "true"
          SKIP_BACKEND_UNDETECTED_CHROMEDRIVER: ${{ matrix.backend != 'undetected_chromedriver' && 'true' || '' }}
          SKIP_BACKEND_CUSTOM_CHROMIUM: ${{ matrix.backend != 'custom_chromium' && 'true' || '' }}
          SKIP_BACKEND_PLAYWRIGHT: ${{ matrix.backend != 'playwright' && 'true' || '' }}
          SKIP_BACKEND_CAMOUFOX: ${{ matrix.backend != 'camoufox' && 'true' || '' }}
          SKIP_BACKEND_SELENIUMBASE: ${{ matrix.backend != 'seleniumbase' && 'true' || '' }}
        run: |
          uv run pytest tests/integration/test_backends.py -vv -m integration -k "${{ matrix.backend }}"

  full-integration-matrix:
    name: Full Integration Tests (${{ matrix.backend }})
    needs: backend-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [undetected_chromedriver, custom_chromium, playwright, camoufox, seleniumbase]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache uv
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pip
          key: uv-cache-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            uv-cache-

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install base dependencies
        run: |
          uv sync --group dev --extra test

      - name: Install Playwright dependencies
        if: matrix.backend == 'playwright'
        run: |
          uv pip install --no-cache-dir 'playwright>=1.50'
          uv run playwright install chromium

      - name: Install Camoufox dependencies
        if: matrix.backend == 'camoufox'
        run: |
          uv pip install --no-cache-dir 'camoufox[geoip]>=0.3'
          uv run python -m camoufox fetch

      - name: Install SeleniumBase dependencies
        if: matrix.backend == 'seleniumbase'
        run: |
          uv pip install --no-cache-dir 'seleniumbase>=4.30'

      - name: Start go-httpbin
        run: |
          for attempt in {1..3}; do
            docker pull mccutchen/go-httpbin:latest && break
            echo "Docker pull attempt $attempt failed, retrying..."
            sleep 5
          done
          docker run -d --name go-httpbin -p 127.0.0.1:8080:8080 mccutchen/go-httpbin:latest
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/get >/dev/null 2>&1; then
              echo "go-httpbin is ready"
              exit 0
            fi
            sleep 2
          done
          echo "go-httpbin failed to start"
          docker logs go-httpbin
          exit 1

      - name: Start FlareSolverr server
        env:
          DRIVER_BACKEND: ${{ matrix.backend }}
          HEADLESS: "true"
          PORT: "8191"
          FLARESOLVERR_SINGLE_THREADED: ${{ (matrix.backend == 'playwright' || matrix.backend == 'camoufox') && 'true' || '' }}
          FLARESOLVERR_CUSTOM_CHROMIUM: ${{ matrix.backend == 'custom_chromium' && 'true' || '' }}
        run: |
          nohup uv run python -m flaresolverr.flaresolverr > /tmp/flaresolverr.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8191/ >/dev/null 2>&1; then
              echo "FlareSolverr is ready"
              exit 0
            fi
            sleep 2
          done
          echo "FlareSolverr failed to start"
          cat /tmp/flaresolverr.log
          exit 1

      - name: Run full integration tests
        env:
          FLARESOLVERR_URL: http://127.0.0.1:8191
          HTTPBIN_URL: http://127.0.0.1:8080
          DRIVER_BACKEND: ${{ matrix.backend }}
        run: |
          uv run pytest tests/integration/test_api.py tests/integration/test_js_injection.py tests/integration/test_sites.py tests/integration/test_bot_challenge.py -vv -m integration -k "not proxy"

      - name: Stop FlareSolverr
        if: always()
        run: |
          pkill -f "flaresolverr.flaresolverr" || true
          cat /tmp/flaresolverr.log || true
          docker stop go-httpbin >/dev/null 2>&1 || true
          docker rm go-httpbin >/dev/null 2>&1 || true
